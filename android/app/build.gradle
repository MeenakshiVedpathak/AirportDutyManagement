apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

react {
    /* Folders */
//   The root of your project, i.e. where "package.json" lives. Default is '..'
// root = file("../")
//   The folder where the react-native NPM package is. Default is ../node_modules/react-native
// reactNativeDir = file("../node_modules/react-native")
//   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
// codegenDir = file("../node_modules/@react-native/codegen")
//   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
// cliFile = file("../node_modules/react-native/cli.js")
}

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.airportdutymanagement'
    defaultConfig {
        applicationId 'com.airportdutymanagement'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            cmake {
                cppFlags '-g0'
                abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            }
        }
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['GTTDATA_RELEASE_STORE_FILE'])
                storePassword keystoreProperties['GTTDATA_RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['GTTDATA_RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['GTTDATA_RELEASE_KEY_PASSWORD']
        } else {
                // Fallback for development
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'debug']
        }
    }
}

dependencies {
    implementation('com.facebook.react:react-android')
    implementation('com.facebook.react:hermes-android')

    // Autolinked native modules
    implementation project(':react-native-fs')
    implementation project(':notifee_react-native')
    implementation project(':react-native-async-storage_async-storage')
    implementation project(':react-native-community_datetimepicker')
    implementation project(':react-native-firebase_app')
    implementation project(':react-native-firebase_messaging')
    implementation project(':react-native-ml-kit_text-recognition')
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-documents_picker')
    implementation project(':react-native-image-picker')
    implementation project(':react-native-permissions')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-screens')
    implementation project(':react-native-share')
    implementation project(':react-native-vector-icons')
    implementation project(':react-native-blob-util')
    implementation project(':react-native-pdf')
}

apply plugin: 'com.google.gms.google-services'
